name: Assemble coop Web release once
on:
  push:
    branches: [coop-web-stage2]
    paths:
      - .github/workflows/assemble-coop-web-once.yml
      - release/coop-web-release-pck.*
      - tools/web/assemble-coop-web.cjs
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'owca217/deep-in-dungeon-site-coop'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coop-web-stage2
      - name: Restore exact exported game pack
        run: |
          node --version
          node tools/web/assemble-coop-web.cjs release/coop-web-release-pck.manifest.json gra/index.pck gra/index.pck
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const release=JSON.parse(fs.readFileSync('coop-release.json','utf8'));
          for(const file of release.files){
            if(!/^gra\/[a-zA-Z0-9._-]+$/.test(file.path))throw new Error('Invalid game path');
            const data=fs.readFileSync(file.path);
            if(data.length!==file.size||crypto.createHash('sha256').update(data).digest('hex')!==file.sha256)throw new Error('Game file mismatch: '+file.path);
          }
          console.log('Exported game hashes verified: '+release.files.length);
          NODE
      - name: Commit complete Web pack on staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- gra/index.pck
          git diff --cached --quiet && exit 0
          git commit -m 'Include verified coop stage 2 Web pack'
          git push origin HEAD:coop-web-stage2
